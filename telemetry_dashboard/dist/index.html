<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>telemetry_dashboard</title>
    <script type="module" crossorigin src="/assets/index-DxX3xEzw.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-h-fm9sBU.css">
    <style>
      body {
        margin: 0;
      }
      .telemetry-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px;
        background: #0f1424;
        border-bottom: 1px solid #202746;
        color: #f5f7ff;
        font-family: Arial, sans-serif;
      }
      .telemetry-header a {
        color: #93c5fd;
        text-decoration: none;
        font-size: 14px;
      }
      .telemetry-header .links {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .observer-search {
        max-width: 1100px;
        margin: 40px auto 0;
        padding: 0 24px 48px;
        color: #e2e8f0;
        font-family: inherit;
      }
      .observer-search-card {
        background: #12172a;
        border: 1px solid #202746;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 18px 40px rgba(10, 12, 24, 0.4);
      }
      .observer-search h2 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      .observer-search p {
        margin: 0;
        color: #9fb0c6;
        font-size: 14px;
      }
      .observer-search-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }
      .observer-filter-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }
      .observer-search-grid label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #93a7c1;
      }
      .observer-filter-grid label,
      .observer-search-grid label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #93a7c1;
      }
      .observer-filter-grid input,
      .observer-filter-grid select,
      .observer-search-grid input,
      .observer-search-grid select {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #243050;
        background: #0f1424;
        color: #e2e8f0;
        font-size: 14px;
      }
      .observer-filter-grid button,
      .observer-search-grid button {
        align-self: end;
        padding: 12px 16px;
        border-radius: 999px;
        border: none;
        background: #3dd5f2;
        color: #0b1020;
        font-weight: 600;
        cursor: pointer;
      }
      .observer-filter-grid button:hover,
      .observer-search-grid button:hover {
        filter: brightness(1.05);
      }
      .observer-filter-status {
        margin-top: 10px;
        font-size: 12px;
        color: #93a7c1;
      }
      .observer-search-status {
        margin-top: 12px;
        font-size: 13px;
        color: #9fb0c6;
      }
      .observer-search-results {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        margin-top: 20px;
      }
      .observer-search-results h3 {
        margin: 0 0 8px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #93a7c1;
      }
      .observer-search-results ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }
      .observer-search-results li {
        padding: 10px 12px;
        border-radius: 10px;
        background: #0f1424;
        border: 1px solid #1d2642;
        font-size: 12px;
        color: #d2d9e6;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .observer-search-chart {
        margin-top: 24px;
        height: 320px;
        position: relative;
        padding-right: 42px;
      }
      .observer-visuals {
        margin-top: 28px;
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr;
      }
      .observer-visual-card {
        background: #0f1424;
        border: 1px solid #1d2642;
        border-radius: 14px;
        padding: 16px;
        position: relative;
        padding-right: 42px;
      }
      .observer-visual-card h3 {
        margin: 0 0 10px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #93a7c1;
      }
      .observer-visual-card canvas {
        width: 100% !important;
        height: 280px !important;
      }
      .observer-visual-card .observer-subtitle {
        margin-top: 16px;
      }
      .observer-metrics {
        margin-top: 28px;
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr;
      }
      .observer-metric-card {
        background: #0f1424;
        border: 1px solid #1d2642;
        border-radius: 14px;
        padding: 16px;
      }
      .observer-metric-card h3 {
        margin: 0 0 10px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #93a7c1;
      }
      .observer-metric-card canvas {
        width: 100% !important;
        height: 240px !important;
      }
      .observer-metrics-status {
        margin-top: 12px;
        font-size: 12px;
        color: #9fb0c6;
      }
      .observer-focus-grid {
        margin-top: 28px;
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }
      .observer-focus-card,
      .observer-queue-card {
        background: #0f1424;
        border: 1px solid #1d2642;
        border-radius: 14px;
        padding: 16px;
      }
      .observer-focus-card h3,
      .observer-queue-card h3 {
        margin: 0 0 10px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #93a7c1;
      }
      .observer-focus-details {
        font-size: 13px;
        color: #d2d9e6;
        line-height: 1.5;
      }
      .observer-focus-actions {
        margin-top: 12px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .observer-focus-actions button,
      .observer-queue-controls button,
      .observer-queue-actions button {
        padding: 8px 14px;
        border-radius: 999px;
        border: none;
        background: #3dd5f2;
        color: #0b1020;
        font-weight: 600;
        cursor: pointer;
      }
      .observer-focus-actions button:disabled,
      .observer-queue-actions button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .observer-queue-controls {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
      }
      .observer-queue-controls select,
      .observer-queue-actions select {
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid #243050;
        background: #0f1424;
        color: #e2e8f0;
        font-size: 13px;
      }
      .observer-queue-items {
        list-style: none;
        padding: 0;
        margin: 0 0 12px;
        display: grid;
        gap: 8px;
        max-height: 240px;
        overflow: auto;
      }
      .observer-queue-items li {
        padding: 10px 12px;
        border-radius: 10px;
        background: #0b1224;
        border: 1px solid #1d2642;
        font-size: 12px;
        color: #d2d9e6;
        display: grid;
        gap: 6px;
      }
      .observer-queue-items button {
        justify-self: start;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid #334155;
        background: transparent;
        color: #93c5fd;
        cursor: pointer;
        font-size: 11px;
      }
      .observer-queue-actions {
        display: grid;
        gap: 10px;
      }
      .observer-queue-status,
      .observer-focus-status {
        margin-top: 10px;
        font-size: 12px;
        color: #93a7c1;
      }
      .chart-scrollbars {
        margin-top: 10px;
        display: grid;
        gap: 6px;
      }
      .chart-scrollbars label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #93a7c1;
        display: grid;
        gap: 6px;
      }
      .chart-scrollbars input[type="range"] {
        width: 100%;
        accent-color: #3dd5f2;
      }
      .chart-scroll-y {
        position: absolute;
        right: 10px;
        top: 48px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
      }
      .chart-scroll-y input[type="range"] {
        width: 12px;
        height: 100%;
        writing-mode: bt-lr;
        -webkit-appearance: slider-vertical;
        accent-color: #3dd5f2;
      }
      .hub-link {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 1000;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid #334155;
        background: rgba(15, 23, 42, 0.85);
        color: #e2e8f0;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        font-size: 11px;
        font-family: Arial, sans-serif;
        text-decoration: none;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
    </style>
  </head>
  <body>
    <a class="hub-link" href="https://sparkleserver.site">SparkleServer Hub</a>
    <header class="telemetry-header">
      <div>AllInKeys Telemetry</div>
      <div class="links">
        <a href="/login">Log in</a>
        <a href="/signup">Sign up</a>
      </div>
    </header>
    <div id="root"></div>
    <div id="observer-search" class="observer-search"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="/observer_search.js"></script>
  </body>
</html>
