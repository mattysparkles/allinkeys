version: '3.8'
services:
  allinkeys:
    build: .
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/app
    command: python main.py
  telemetry:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: python -m telemetry_service
