{% extends "base.html" %}
{% block title %}Telemetry Pairing{% endblock %}
{% block content %}
<div class="card">
  <h1>Approve this machine</h1>
  <p>Enter the pairing code shown in the CLI to approve the request.</p>
  <form method="post" action="/pair/approve">
    <label for="pair_code">Pairing Code</label>
    <input
      id="pair_code"
      name="pair_code"
      placeholder="ABC123"
      value="{{ pair_code }}"
      required
    />
    <button class="primary" type="submit">Approve this machine</button>
  </form>
</div>
{% endblock %}
