<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Telemetry{% endblock %}</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b0f19;
        color: #f5f7ff;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px;
        background: #0f1424;
        border-bottom: 1px solid #202746;
      }
      header a,
      header button {
        color: #93c5fd;
        background: none;
        border: none;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        font-family: inherit;
      }
      header .links {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      main {
        display: flex;
        justify-content: center;
        padding: 48px 16px;
      }
      .card {
        background: #141a2b;
        border-radius: 12px;
        padding: 24px;
        width: 420px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin-top: 0;
        font-size: 22px;
      }
      label {
        display: block;
        margin-top: 14px;
        font-size: 13px;
        color: #c7d2fe;
      }
      input {
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #2a3250;
        background: #0f1424;
        color: #f5f7ff;
      }
      button.primary {
        margin-top: 18px;
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      .message {
        margin-top: 16px;
        font-size: 13px;
        color: #93c5fd;
        white-space: pre-wrap;
      }
      .link {
        margin-top: 12px;
        font-size: 13px;
      }
      .link a {
        color: #93c5fd;
        text-decoration: none;
      }
      .hint {
        font-size: 13px;
        color: #c7d2fe;
        line-height: 1.4;
      }
    </style>
    {% block head_extra %}{% endblock %}
  </head>
  <body>
    <header>
      <div>AllInKeys Telemetry</div>
      <div class="links">
        {% if current_user %}
        <a href="/dashboard/machines">Dashboard</a>
        <form method="post" action="/logout">
          <button type="submit">Log out</button>
        </form>
        {% else %}
        <a href="/signup">Sign up</a>
        <a href="/login">Log in</a>
        {% endif %}
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
