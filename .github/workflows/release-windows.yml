name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g., v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          Get-Content requirements.txt | Where-Object { $_ -and $_ -notmatch '^\s*#' -and $_ -notmatch '^\s*tk\s*$' } | Set-Content requirements-windows.txt
          python -m pip install -r requirements-windows.txt
          python -m pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging\allinkeys.spec

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}"
          if (-not $version) { $version = "v0.1.0" }
          $version = $version -replace '^v',''
          $env:APP_VERSION = $version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION packaging\windows-installer.iss

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            dist/installer/AllInKeys-Setup-*.exe
          draft: false
          prerelease: false
